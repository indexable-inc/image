# Starship prompt of the ix/base image: Andrew's own ~/.config/starship.toml, copied 1:1 (2026-10-09, coordinator request)
# except custom.claude, whose `when` was nu and is now POSIX sh with the same logic (set-ness of the variables), and
# [hostname], which names the VM in every session (see there).
# Loaded by nix/modules/guest/ix-terminal.nix, whose starship_prompt_check.py renders it at image build time.
format = "${custom.submodule_chain}$username$hostname$localip$directory${custom.physical_dir}$git_branch$git_status$all$line_break$character"

[aws]
disabled = true
symbol = " "

[azure]
symbol = " "

[battery]
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
empty_symbol = "󰂎 "
full_symbol = "󰁹 "
unknown_symbol = "󰂑 "

[buf]
disabled = true
symbol = " "

[bun]
disabled = true
symbol = " "

[c]
symbol = " "

[cmake]
symbol = " "

[cobol]
symbol = " "

[conda]
symbol = " "

[container]
symbol = " "

[cpp]
symbol = " "

[crystal]
symbol = " "

[custom.claude]
command = "echo 🤖"
description = "Shows when in a Claude Code session"
format = "[$output]($style) "
style = "bold blue"
shell = ["sh", "-c"]
when = '''[ -n "${CLAUDE_CODE+x}" ] || [ -n "${CLAUDE_SESSION+x}" ]'''

[custom.commit_age]
command = "git log -1 --format=%cr 2>/dev/null"
description = "Relative time since the latest commit"
format = "([$output]($style) )"
ignore_timeout = true
require_repo = true
shell = ["sh", "-c"]
style = "italic dimmed"
use_stdin = false
when = true

[custom.physical_dir]
command = "pwd -P"
description = "Physical path when the cwd is reached through a symlink"
format = "[($output)]($style) "
ignore_timeout = true
shell = ["sh", "-c"]
style = "dimmed"
use_stdin = false
when = '[ "$PWD" != "$(pwd -P)" ]'

[custom.submodule_chain]
command = 'sup=$(git rev-parse --show-superproject-working-tree 2>/dev/null); names=""; while [ -n "$sup" ]; do b=$(basename "$sup"); if [ -z "$names" ]; then names="$b"; else names="$b › $names"; fi; sup=$(git -C "$sup" rev-parse --show-superproject-working-tree 2>/dev/null); done; printf "%s" "$names"'
description = "Breadcrumb of git superproject repos when inside a submodule"
format = "([$output ›]($style) )"
ignore_timeout = true
require_repo = true
shell = ["sh", "-c"]
style = "dimmed"
use_stdin = false
when = true

[dart]
symbol = " "

[deno]
symbol = " "

[directory.substitutions]
"~/Projects/" = ""

[direnv]
allowed_msg = ""
denied_msg = "✗"
