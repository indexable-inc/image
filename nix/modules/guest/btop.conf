#? ix/base btop defaults. ./ix-terminal.nix copies this file to ~/.config/btop/btop.conf only when that file
#? is absent, so a user's own config always wins; btop rewrites it with every option on its first exit.
#? ./btop_conf_check.py runs the packaged btop on it against a light and a dark terminal at build time.

#* Ask the terminal for its background color at startup (OSC 11): gruvbox light on a light background,
#* gruvbox dark on a dark one and on a terminal that does not answer.
theme_mode = "Auto"

#* gruvbox_dark_v2 is the bundled dark theme on gruvbox's own colors (bg0 #282828, fg1 #ebdbb2, neutral
#* accents); gruvbox_dark dims all text to gray #a89984 and gruvbox_material_dark is a different palette.
color_theme_dark = "gruvbox_dark_v2"
color_theme_light = "gruvbox_light"

#* The terminal paints the background, so a translucent or custom terminal background shows through.
theme_background = False

graph_symbol = "block"
